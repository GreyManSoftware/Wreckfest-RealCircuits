[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trackgen-geom"
dynamic = ["version"]
description = "Geometry core for the Wreckfest Track Generator (pure Python, Blender-independent)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.version]
path = "src/trackgen_geom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trackgen_geom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
