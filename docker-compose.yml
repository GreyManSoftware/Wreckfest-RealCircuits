# Local development stack. CPU/memory limits keep the host under the 75% CPU budget.
# Default: the geometry service. Build worker (Blender + Wine) only with the worker profile.
name: trackgen

services:
  geom:
    build:
      context: geom
      # The builder's pure-numpy scenery planner (worker/builder/wfbuild) for POST /scenery; see geom/Dockerfile.
      additional_contexts:
        wfbuild: worker/builder
    image: trackgen-geom:dev
    # Geometry service on a localhost-only port (http://localhost:8000); never exposed beyond this machine.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # A slow build returns a clear 503 rather than a client timeout.
      GEOM_COMPUTE_TIMEOUT_S: "15"
      GEOM_MAX_CONCURRENCY: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cpus: 1.0
    mem_limit: 512m
    restart: unless-stopped

  worker:
    # Opt-in (needs the Wreckfest install). One-off commands, e.g.:
    #   docker compose --profile worker run --rm worker info
    #   docker compose --profile worker run --rm worker builder-tests oval
    # Builds that write files need an output mount (see worker/README.md). The queue consumer (`worker`) needs
    # a storage queue and an API.
    profiles: ["worker"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: trackgen-worker:dev
    command: ["info"]
    volumes:
      # The Wreckfest install (bgeometry.exe, bimage.exe, stock data) is mounted read-only, never baked in.
      - type: bind
        source: ${WRECKFEST_DIR:-D:/SteamLibrary/steamapps/common/Wreckfest}
        target: /wreckfest
        read_only: true
    cpus: 4.0
    mem_limit: 6g
