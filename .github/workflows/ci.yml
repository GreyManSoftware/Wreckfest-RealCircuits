name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geom:
    name: Python geometry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: geom/pyproject.toml
      - run: python -m pip install -e ".[service,test]" -e ../worker/builder
      - run: python -m pytest
      - name: tools (bundle builder)
        run: python -m pytest -q ../tools/tests/test_build_track_bundle.py

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose --profile worker config --quiet

  codegen:
    name: Generated code up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python schema/codegen/generate.py
      - name: Fail if regenerated files differ from the commit
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
